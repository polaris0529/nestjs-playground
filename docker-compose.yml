services:
  db:
    container_name: workflow-db
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - workflow-db-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  app:
    container_name: workflow-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - internal
      - nginx-proxy
      - monitoring
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  workflow-db-data:

networks:
  internal:
  nginx-proxy:
    external: true
    name: nginx-net
  monitoring:
    external: true
    name: monitoring
