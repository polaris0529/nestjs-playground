services:
  db:
    container_name: workflow-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - workflow-db-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  app:
    container_name: workflow-app
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      SERVER_PORT: ${SERVER_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1800}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
      COOKIE_ACCESS_NAME: ${COOKIE_ACCESS_NAME:-access_token}
      COOKIE_REFRESH_NAME: ${COOKIE_REFRESH_NAME:-refresh_token}
    networks:
      - internal
      - nginx-proxy
      - monitoring
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/metrics']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

volumes:
  workflow-db-data:
    name: workflow-db-data

networks:
  internal:
  nginx-proxy:
    external: true
    name: nginx-net
  monitoring:
    external: true
    name: monitoring
